<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallpaper Picker Preview</title>
  <style>
    :root {
      --panel: rgba(24, 28, 34, 0.97);
      --line: rgba(255, 255, 255, 0.12);
      --tile: rgba(255, 255, 255, 0.055);
      --tile-hover: rgba(51, 204, 255, 0.14);
      --text: #f4f7fb;
      --muted: rgba(244, 247, 251, 0.70);
      --blue: #33ccff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #11151d;
      color: var(--text);
      font: 13px "JetBrains Mono", "JetBrainsMono Nerd Font", monospace;
    }

    .scene {
      width: 1280px;
      height: 720px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(rgba(8, 11, 16, 0.24), rgba(8, 11, 16, 0.24)),
        url("../../appendix/wallpapers/Crimson%20Witch%20-%20Crack.png") center / cover;
    }

    .panel {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 784px;
      transform: translate(-50%, -50%);
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.40);
    }

    .header {
      height: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .title {
      flex: 1;
      font-weight: 700;
      color: rgba(244, 247, 251, 0.80);
    }

    .icon-button {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: rgba(244, 247, 251, 0.72);
      background: transparent;
    }

    .icon-button.active,
    .icon-button:hover {
      background: rgba(255, 255, 255, 0.10);
    }

    .grid {
      height: 588px;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 2px;
    }

    .tile {
      min-height: 174px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.075);
      border-radius: 7px;
      background: var(--tile);
    }

    .tile.active {
      background: rgba(51, 204, 255, 0.18);
      border-color: rgba(51, 204, 255, 0.55);
    }

    .tile img {
      width: 100%;
      height: 130px;
      display: block;
      object-fit: cover;
      border-radius: 5px;
    }

    .name {
      height: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      margin-top: 6px;
      color: rgba(244, 247, 251, 0.86);
      font-size: 12px;
    }

    .check {
      width: 14px;
      color: var(--blue);
      font-size: 11px;
    }

    .label {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="Wallpaper picker mockup">
    <section class="panel">
      <header class="header">
        <div class="title">Wallpapers</div>
        <div class="icon-button" title="Open wallpapers folder"></div>
        <div class="icon-button" title="Random wallpaper"></div>
        <div class="icon-button" title="Close">󰅖</div>
      </header>

      <div class="grid">
        <article class="tile active">
          <img src="../../appendix/wallpapers/Crimson%20Witch%20-%20Crack.png" alt="Crimson Witch - Crack">
          <div class="name"><span class="check">󰄬</span><span class="label">Crimson Witch - Crack</span></div>
        </article>
        <article class="tile">
          <img src="../../appendix/wallpapers/Bon%20Voyage.png" alt="Bon Voyage">
          <div class="name"><span class="check"></span><span class="label">Bon Voyage</span></div>
        </article>
        <article class="tile">
          <img src="../../appendix/wallpapers/Crimson%20Witch%20-%20Emily.png" alt="Crimson Witch - Emily">
          <div class="name"><span class="check"></span><span class="label">Crimson Witch - Emily</span></div>
        </article>
        <article class="tile">
          <img src="../../appendix/wallpapers/Crimson%20Witch%20-%20Encounter.png" alt="Crimson Witch - Encounter">
          <div class="name"><span class="check"></span><span class="label">Crimson Witch - Encounter</span></div>
        </article>
        <article class="tile">
          <img src="../../appendix/wallpapers/Crimson%20Witch%20-%20return.png" alt="Crimson Witch - return">
          <div class="name"><span class="check"></span><span class="label">Crimson Witch - return</span></div>
        </article>
        <article class="tile">
          <img src="../../appendix/wallpapers/Crimson%20Witch%20-%20rising.png" alt="Crimson Witch - rising">
          <div class="name"><span class="check"></span><span class="label">Crimson Witch - rising</span></div>
        </article>
        <article class="tile">
          <img src="../../appendix/wallpapers/Middle%20Of%20The%20Ocean.png" alt="Middle Of The Ocean">
          <div class="name"><span class="check"></span><span class="label">Middle Of The Ocean</span></div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
