# Aquatic Abyss — Noctalia base configuration (AA-owned).
#
# Loaded when the Noctalia desktop backend is active (AA_BACKEND="noctalia",
# see config/defaults.env). This directory is symlinked to ~/.config/noctalia
# like the other .config dirs; Noctalia merges *.toml files alphabetically.
#
# Do NOT edit this file for machine-specific tweaks — create 90-user.toml
# next to it (gitignored, merges last, wins) or use the settings GUI
# (state lives in ~/.local/state/noctalia/settings.toml and wins over files;
# delete it to reset to these defaults).
#
# Key names verified against `noctalia config export full` (v5.0.0-beta2+).

[theme]
source = "custom"
custom_palette = "AquaticAbyss"
mode = "dark"

[bar.default]
position = "top"

[wallpaper]
# In Noctalia mode, Noctalia owns the wallpaper layer — hyprpaper is not
# started (see the AA_BACKEND branch in .config/hypr/hyprland.lua).
directory = "~/Pictures/Wallpapers"
enabled = true

# Idle/lock stays with hypridle + hyprlock (started unconditionally by
# hyprland.lua); Noctalia's idle behaviors ship disabled, so there is
# exactly one idle owner. See docs/prompts/NOCTALIA.md sections 8 and 13.
